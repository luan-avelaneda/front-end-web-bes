<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/global.css">
  <script src="scripts/index.js" defer></script>
  <title>Inscrição para oficina</title>
</head>
<body>
  <header>
    <p class="identificacao">OFICINA CRIATIVA</p>
    <h1>Faça sua inscrição</h1>
    <p>Preencha seus dados para receber informações sobre a próxima oficina.</p>
  </header>
  <main>
    <h2>Seus dados</h2>
    <form id="cadastro" novalidate onsubmit="executar(event)">
      <label for="nome">Nome completo*</label>
      <input type="text" id="nome" placeholder="Como podemos te chamar?">
      <p id="erro-nome" class="oculto"></p>

      <label for="idade">Idade*</label>
      <input type="number" id="idade" placeholder="Você precisa ter 18 anos ou mais">
      <p id="erro-idade" class="oculto"></p>

      <label for="celular">Celular com WhatsApp*</label>
      <input type="text" id="celular" placeholder="(00) 00000-0000" oninput="mascararCelular(event)">
      <p id="erro-celular" class="oculto"></p>


      <label for="email">E-mail para contato*</label>
      <input type="email" id="email" placeholder="voce@exemplo.com">
      <p id="erro-email" class="oculto"></p>

      <label>
        <input type="checkbox" id="termos">
        Autorizo o uso dos meus dados para contato sobre a oficina.
        <p id="erro-termos" class="oculto"></p>
      </label>

      <button type="submit">Quero me inscrever</button>
      <p id="concluido" class="oculto"></p>

    </form>
  </main>
  <footer>
    <p>Uma atividade prática de formulários e JavaScript.</p>
  </footer>
</body>
</html>
